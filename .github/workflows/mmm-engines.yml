name: MMM engines

# Proves the marketing-mix engine pins (ops/mmm) actually install and fit, on a
# GitHub runner rather than the owner's 8 GB Mac. Each engine job installs its
# requirements file on Python 3.11, runs the package tests (the engine fits
# unskip themselves once the library imports) and fits a short synthetic
# dataset end to end through the CLI. Runs when ops/mmm changes and on the
# first of every month, so a pin that PyPI has moved past is noticed before a
# real fit needs it. Also on demand (workflow_dispatch).
on:
  push:
    branches: [ main, master, 'claude/**', 'deploy/**' ]
    paths:
      - 'goldplus-commerce/ops/mmm/**'
      - '.github/workflows/mmm-engines.yml'
  pull_request:
    branches: [ main, master, 'deploy/**' ]
    paths:
      - 'goldplus-commerce/ops/mmm/**'
      - '.github/workflows/mmm-engines.yml'
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: goldplus-commerce/ops/mmm

jobs:
  pymc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned 2026-10-07
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5, pinned 2026-10-23
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: goldplus-commerce/ops/mmm/requirements-pymc.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-pymc.txt pytest
      - name: Report the versions that resolved
        run: python -m pip list --format=freeze | grep -iE '^(pymc|pymc-marketing|pytensor|arviz|numpy|pandas|xarray)='
      - name: Package tests (engine fits unskip with the library present)
        run: python -m pytest tests -q -rs
      - name: Synthetic fit through the CLI
        run: |
          python -m goldplus_mmm synthetic --out-dir /tmp/synth --weeks 104 --seed 1
          python -m goldplus_mmm readiness --daily /tmp/synth/daily.csv --controls /tmp/synth/controls.csv
          python -m goldplus_mmm fit --engine pymc --daily /tmp/synth/daily.csv --controls /tmp/synth/controls.csv --out /tmp/synth/pymc.json --draws 200 --tune 200 --chains 1
          python - <<'EOF'
          import json; r = json.load(open('/tmp/synth/pymc.json'))
          assert r['engine'] == 'pymc' and len(r['channels']) == 3, r
          assert all(c['roas_mean'] > 0 for c in r['channels']), r['channels']
          print('pymc fit ok:', {c['channel']: round(c['roas_mean'], 2) for c in r['channels']})
          EOF

  meridian:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned 2026-10-07
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5, pinned 2026-10-23
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: goldplus-commerce/ops/mmm/requirements-meridian.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-meridian.txt pytest
      - name: Report the versions that resolved
        run: python -m pip list --format=freeze | grep -iE '^(google-meridian|tensorflow|tensorflow-probability|tf-keras|numpy|pandas|xarray)='
      - name: Package tests (engine fits unskip with the library present)
        run: python -m pytest tests -q -rs
      - name: Synthetic fit through the CLI
        run: |
          python -m goldplus_mmm synthetic --out-dir /tmp/synth --weeks 104 --seed 1
          python -m goldplus_mmm fit --engine meridian --daily /tmp/synth/daily.csv --controls /tmp/synth/controls.csv --out /tmp/synth/meridian.json --draws 100 --tune 100 --chains 1
          python - <<'EOF'
          import json; r = json.load(open('/tmp/synth/meridian.json'))
          assert r['engine'] == 'meridian' and len(r['channels']) == 3, r
          assert all(c['roas_mean'] > 0 for c in r['channels']), r['channels']
          print('meridian fit ok:', {c['channel']: round(c['roas_mean'], 2) for c in r['channels']})
          EOF
