name: CI

# The application lives in goldplus-commerce/, but GitHub Actions only reads
# .github/workflows at the REPOSITORY ROOT — so this canonical workflow lives
# here (the previous copy under goldplus-commerce/.github was never executed).
# All `run:` steps default to the app directory.

# deploy/** is where production is cut from (scripts/deploy-prod.sh rolls its
# tip). Until 2026-10-07 nothing here ran for that branch, so a lint error, a
# type error and three red unit tests reached it unnoticed.
on:
  push:
    branches: [ main, master, 'claude/**', 'deploy/**' ]
  pull_request:
    branches: [ main, master, 'deploy/**' ]

defaults:
  run:
    working-directory: goldplus-commerce

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned 2026-10-07
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4, pinned 2026-10-07
        with:
          version: 9.1.4  # the version Dockerfile.api/web build with; pnpm 8 cannot read lockfile v9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4, pinned 2026-10-07
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: goldplus-commerce/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:architecture
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm security:scan-secrets

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: goldplus_test
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [ '6379:6379' ]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/goldplus_test
      JWT_SECRET: ci-only-test-jwt-secret-000000000000000000000000
      IDENTITY_HASH_PEPPER: ci-only-test-identity-pepper-0000000000000000
      MTN_WEBHOOK_SECRET: ci-only-test-mtn-webhook-secret-0000
      AIRTEL_WEBHOOK_SECRET: ci-only-test-airtel-webhook-secret-0000
      PUBLIC_API_BASE_URL: http://127.0.0.1:3000
      NODE_ENV: development
      AUTH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/goldplus_test
      COMMERCE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/goldplus_test
      ANALYTICS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/goldplus_it
      REDIS_TEST_URL: redis://localhost:6379
      # The measurement suite routes GA4 only when a measurement id exists;
      # these are the values scripts/integration-on-clone.sh has always used.
      GA4_MEASUREMENT_ID: G-ITEST00001
      METRICS_INTERNAL_URL: http://127.0.0.1:9
      PROXY_TOPOLOGY_MODE: DIRECT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned 2026-10-07
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4, pinned 2026-10-07
        with:
          version: 9.1.4  # the version Dockerfile.api/web build with; pnpm 8 cannot read lockfile v9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4, pinned 2026-10-07
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: goldplus-commerce/pnpm-lock.yaml
      - run: pnpm install
      - name: Apply migrations
        run: pnpm -F @goldplus/api db:migrate
      - name: Verify migration parity
        run: node scripts/release/claude/verify-migration-parity.mjs
      - name: Create isolated analytics DB (self-contained suites drop/recreate)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database goldplus_it;'
      # One file at a time (see package.json): the suites share this database,
      # and in parallel one suite's live ad platforms leaked into another's
      # routing (Meta/X/measurement failed together, passed alone).
      - name: Integration tests (real PostgreSQL + Redis)
        run: pnpm test:integration

  # The real checkout path, end to end: a cookie-carrying client -> Astro SSR -> the API -> PostgreSQL + Redis ->
  # a local PesaPal stub (no external call, no real money). It silently stopped passing after the Astro 6 upgrade
  # (no Origin header) and migration 0194 (temp table outside a transaction) because nothing ran it; now CI does.
  # Covers duplicate-order safety, payment ownership, and gift card / store credit tender (0196).
  checkout-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [ '6379:6379' ]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      E2E_PG_PORT: '5432'
      E2E_REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned 2026-10-07
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4, pinned 2026-10-07
        with:
          version: 9.1.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4, pinned 2026-10-07
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: goldplus-commerce/pnpm-lock.yaml
      - run: pnpm install
      - run: sudo apt-get install -y --no-install-recommends redis-tools postgresql-client
      - name: End-to-end checkout proofs
        run: bash scripts/qa/checkout-e2e-harness.sh
      - name: Logs on failure
        if: failure()
        run: tail -60 /tmp/goldplus-e2e/api.log; tail -40 /tmp/goldplus-e2e/web.log

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned 2026-10-07
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4, pinned 2026-10-07
        with:
          version: 10.17.1  # audit only: honours pnpm.auditConfig.ignoreGhsas (9.1.4 ignores it); same lockfile v9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4, pinned 2026-10-07
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: goldplus-commerce/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  sast-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned 2026-10-07
      # One rule excluded, with evidence in goldplus-commerce/docs/security/audit-exceptions.md:
      # raw-html-format fires on our HTML email templates, where every value is
      # escaped (escapeHtml / the escaping renderer) and a nosemgrep comment would
      # land inside the email markup itself. Everything else is fixed or annotated.
      - run: semgrep scan --config auto --error --exclude-rule javascript.express.security.injection.raw-html-format.raw-html-format
        working-directory: .

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned 2026-10-07
      - name: Generate SBOM (SPDX) for the application
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0, pinned 2026-10-07
        with:
          path: goldplus-commerce
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4, pinned 2026-10-07
        with:
          name: sbom-spdx
          path: sbom.spdx.json

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned 2026-10-07
      # Filesystem vulnerability scan of deps + config (fails on CRITICAL/HIGH).
      # The final production IMAGE scan runs in the release workflow before deploy.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0, pinned 2026-10-07
        with:
          scan-type: fs
          scan-ref: goldplus-commerce
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          # Reviewed exceptions, shared with the pnpm audit (docs/security/audit-exceptions.md).
          trivyignores: goldplus-commerce/.trivyignore
          # Lab tooling with its own npm lockfile, never built into an image.
          skip-dirs: goldplus-commerce/performance-audit,goldplus-commerce/compatibility-audit

  # The production API image (Alpine, musl) is built nowhere else before deploy. Gift card photos (0201) use
  # sharp, a native module: prove the compiled processor loads it and turns a camera JPEG into a 1080 px square
  # inside that exact image, so a missing binary is caught here rather than on the first customer's photo.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned 2026-10-07
      - name: Build the production API image
        run: docker build -f Dockerfile.api -t goldplus-api:ci .
      - name: Gift card photos work inside it
        run: |
          docker run --rm --entrypoint node goldplus-api:ci -e "
            const { SharpGiftCardPhotoProcessor } = require('./apps/api/dist/infrastructure/credit/SharpGiftCardPhotoProcessor.js');
            const sharp = require('sharp');
            sharp({ create: { width: 1600, height: 1200, channels: 3, background: '#96CC06' } })
              .jpeg().withExif({ IFD0: { Make: 'CiCam' } }).toBuffer()
              .then((b) => new SharpGiftCardPhotoProcessor().process(b))
              .then((o) => {
                if (o.width !== 1080 || o.height !== 1080 || o.image.includes(Buffer.from('CiCam'))) throw new Error('unexpected output');
                console.log('sharp works in the API image:', o.image.length, 'bytes');
              })
              .catch((e) => { console.error(e); process.exit(1); });
          "

  # The browser suite needs a running shop. Until 2026-10-07 this job started
  # nothing, so all ~370 tests failed with "connection refused" and the job
  # was ignored. Now: real Postgres + Redis, migrated and seeded, the API (tsx,
  # as in dev: the shared package is TypeScript) and the built website, then
  # Chromium desktop + mobile. Admin-only specs skip without E2E_ADMIN_*.
  e2e-playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: goldplus_e2e
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [ '6379:6379' ]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/goldplus_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-test-jwt-secret-000000000000000000000000
      IDENTITY_HASH_PEPPER: ci-only-test-identity-pepper-0000000000000000
      MTN_WEBHOOK_SECRET: ci-only-test-mtn-webhook-secret-0000
      AIRTEL_WEBHOOK_SECRET: ci-only-test-airtel-webhook-secret-0000
      PUBLIC_API_BASE_URL: http://127.0.0.1:3000
      INTERNAL_API_ORIGIN: http://127.0.0.1:3000
      PROXY_TOPOLOGY_MODE: DIRECT
      NODE_ENV: development
      E2E_WEB_BASE: http://127.0.0.1:4321
      E2E_API_BASE: http://127.0.0.1:3000
      # Goldie's widget renders only with a model key (as in production). A placeholder key plus a closed local
      # model URL: the real widget is tested, nothing reaches Anthropic, and model turns take the fallback path.
      ANTHROPIC_API_KEY: ci-placeholder-not-a-key
      ANTHROPIC_MESSAGES_URL: http://127.0.0.1:9/v1/messages
      INTERNAL_API_KEY: ci-only-internal-key-000000000000000000000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned 2026-10-07
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4, pinned 2026-10-07
        with:
          version: 9.1.4  # the version Dockerfile.api/web build with; pnpm 8 cannot read lockfile v9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4, pinned 2026-10-07
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: goldplus-commerce/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm -F @goldplus/api db:migrate
      - run: pnpm exec tsx scripts/seed.ts
      - run: pnpm build
      - name: Start API and website
        run: |
          (cd apps/api && nohup pnpm exec tsx src/interfaces/http/server.ts > /tmp/api.log 2>&1 &)
          (HOST=127.0.0.1 PORT=4321 nohup node apps/web/dist/server/entry.mjs > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/health/live >/dev/null && curl -sf http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 2
          done
          echo "API or website never came up"; tail -40 /tmp/api.log; tail -40 /tmp/web.log; exit 1
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright e2e (isolated data; no real payments/messages/provider events)
        run: pnpm exec playwright test --project=chromium-desktop --project=chromium-mobile
      - name: Server logs on failure
        if: failure()
        run: tail -80 /tmp/api.log; tail -40 /tmp/web.log
