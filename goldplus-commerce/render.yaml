services:
  # ---------------------------------------------------------------------------
  # 1. Hono Backend API Service
  # ---------------------------------------------------------------------------
  - type: web
    name: goldplus-api-staging
    env: node
    plan: starter
    rootDir: apps/api
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/interfaces/http/server.js
    customDomains:
      - staging-api.shopgoldplus.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: goldplus-db-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: IDENTITY_HASH_PEPPER
        generateValue: true
      - key: MTN_WEBHOOK_SECRET
        generateValue: true
      - key: AIRTEL_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_API_BASE_URL
        value: https://staging-api.shopgoldplus.com
      - key: CORS_ORIGIN
        value: https://staging.shopgoldplus.com
      - key: COOKIE_SECURE
        value: "true"
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: robsebunya@gmail.com
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value: Goldplus2026!
      - key: BOOTSTRAP_ADMIN_PHONE
        value: "+256705004545"

  # ---------------------------------------------------------------------------
  # 2. Astro Storefront Console Service
  # ---------------------------------------------------------------------------
  - type: web
    name: goldplus-web-staging
    env: node
    plan: starter
    rootDir: apps/web
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    customDomains:
      - staging.shopgoldplus.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_API_BASE_URL
        value: https://staging-api.shopgoldplus.com

# ---------------------------------------------------------------------------
# 3. Cloud-Managed Postgres Database
# ---------------------------------------------------------------------------
databases:
  - name: goldplus-db-staging
    plan: starter
    postgresMajorVersion: 15
