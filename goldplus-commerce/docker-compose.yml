version: '3.8'
services:
  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service -- this service writes its own data/cache by design
  postgres:
    security_opt:
      - no-new-privileges:true
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: goldplus
      POSTGRES_PASSWORD: password
      POSTGRES_DB: goldplus_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
