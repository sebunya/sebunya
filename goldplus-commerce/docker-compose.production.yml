services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgbouncer:
    # Pinned by digest: `latest` drifted to a build whose default listen_port is 5432,
    # which made the :6432 healthcheck fail and (via depends_on) blocked the API from
    # starting even though the API connects to postgres directly. Digest = PgBouncer
    # 1.25.2 (edoburu has no matching semver tag), re-pointed to 6432 via LISTEN_PORT.
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_DATABASE=${POSTGRES_DB}
      # Listen on the intended pooling port so the healthcheck and the published
      # 6432 mapping agree with the process.
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U $$DB_USER -d $$DB_DATABASE || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    # The API connects to postgres directly (DATABASE_URL=postgres:5432), so it gates
    # its startup on postgres + redis — the services it actually uses — not on
    # pgbouncer. Gating on an unused pooler is what let a pgbouncer image drift take
    # the whole API down.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      # Explicit proxy topology is REQUIRED in production (clientAddress guard):
      # Caddy is the edge here, so trusted client IP comes from its forwarded header.
      - PROXY_TOPOLOGY_MODE=${PROXY_TOPOLOGY_MODE:-CADDY_EDGE}
      # Synthetic monitor mutating stages (place a real order + payment webhook) are OFF
      # in production; the read-only journey remains the health signal. Only a dedicated
      # synthetic-safe environment should set this true.
      - SYNTHETIC_MONITOR_WRITE_STAGES_ENABLED=${SYNTHETIC_MONITOR_WRITE_STAGES_ENABLED:-false}
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      # Cart/checkout identity is signed by the storefront (BFF) and verified here.
      # Dedicated secrets (not JWT_SECRET) keep the cart/intent key streams isolated
      # from the session-token stream. Web and API MUST share the same values or every
      # shopper loses their basket / cannot check out.
      - CART_CREDENTIAL_SECRET=${CART_CREDENTIAL_SECRET}
      - CHECKOUT_INTENT_SECRET=${CHECKOUT_INTENT_SECRET}
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - IDENTITY_HASH_PEPPER=${IDENTITY_HASH_PEPPER}
      - MTN_WEBHOOK_SECRET=${MTN_WEBHOOK_SECRET}
      - AIRTEL_WEBHOOK_SECRET=${AIRTEL_WEBHOOK_SECRET}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD}
      - BOOTSTRAP_ADMIN_PHONE=${BOOTSTRAP_ADMIN_PHONE}
      - PESAPAL_ENV=${PESAPAL_ENV}
      - PESAPAL_BASE_URL=${PESAPAL_BASE_URL}
      - PESAPAL_CONSUMER_KEY=${PESAPAL_CONSUMER_KEY}
      - PESAPAL_CONSUMER_SECRET=${PESAPAL_CONSUMER_SECRET}
      - PESAPAL_CURRENCY=${PESAPAL_CURRENCY}
      - PESAPAL_COUNTRY_CODE=${PESAPAL_COUNTRY_CODE}
      - PESAPAL_BRANCH=${PESAPAL_BRANCH}
      - PESAPAL_REDIRECT_MODE=${PESAPAL_REDIRECT_MODE}
      - PESAPAL_CALLBACK_URL=${PESAPAL_CALLBACK_URL}
      - PESAPAL_CANCELLATION_URL=${PESAPAL_CANCELLATION_URL}
      - PESAPAL_IPN_URL=${PESAPAL_IPN_URL}
      - PESAPAL_IPN_ID=${PESAPAL_IPN_ID}
      - SMS_PROVIDER=${SMS_PROVIDER}
      - SMS_BASE_URL=${SMS_BASE_URL}
      - SMS_USERNAME=${SMS_USERNAME}
      - SMS_API_KEY=${SMS_API_KEY}
      - SMS_SENDER_ID=${SMS_SENDER_ID}
      - SMS_DEFAULT_COUNTRY_CODE=${SMS_DEFAULT_COUNTRY_CODE}
      - SMS_PRIORITY=${SMS_PRIORITY}
      - SMS_TIMEOUT_MS=${SMS_TIMEOUT_MS}
      - NOTIFICATIONS_SMS_ENABLED=${NOTIFICATIONS_SMS_ENABLED}
      - NOTIFICATIONS_DRY_RUN=${NOTIFICATIONS_DRY_RUN}
      - NOTIFICATIONS_LIVE_SEND_ENABLED=${NOTIFICATIONS_LIVE_SEND_ENABLED}
      - NOTIFICATIONS_ALLOWED_TEST_RECIPIENTS=${NOTIFICATIONS_ALLOWED_TEST_RECIPIENTS}
      - ZEPTOMAIL_BASE_URL=${ZEPTOMAIL_BASE_URL}
      - ZEPTOMAIL_API_TOKEN=${ZEPTOMAIL_API_TOKEN}
      - ZEPTOMAIL_FROM_ADDRESS=${ZEPTOMAIL_FROM_ADDRESS}
      - ZEPTOMAIL_FROM_NAME=${ZEPTOMAIL_FROM_NAME}
      - ZEPTOMAIL_REPLY_TO=${ZEPTOMAIL_REPLY_TO}
      - ZEPTOMAIL_TIMEOUT_MS=${ZEPTOMAIL_TIMEOUT_MS}
      - NOTIFICATIONS_EMAIL_ENABLED=${NOTIFICATIONS_EMAIL_ENABLED}
      - ZEPTOMAIL_API_BASE_URL=${ZEPTOMAIL_API_BASE_URL}
      - NOTIFICATIONS_PROVIDER_TIMEOUT_MS=${NOTIFICATIONS_PROVIDER_TIMEOUT_MS}
      - METRICS_INTERNAL_URL=${METRICS_INTERNAL_URL:-http://sgtm-production:8080}
      - SHADOW_TRAFFIC_URL=${SHADOW_TRAFFIC_URL:-}
      - SHADOW_TRAFFIC_RATIO=${SHADOW_TRAFFIC_RATIO:-0}
      - NODE_OPTIONS=--max-old-space-size=400
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 15s
        max_failure_ratio: 0.1
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL}
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4321
      - HOST=0.0.0.0
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL}
      # SSR calls the API over the internal compose network (never the public
      # edge). Default to the api service; overridable per environment.
      - INTERNAL_API_ORIGIN=${INTERNAL_API_ORIGIN:-http://api:3000}
      # The storefront is the Backend-for-Frontend that MINTS the signed cart and
      # checkout-intent credentials the API verifies. Without these the storefront
      # cannot mint a credential (keys() returns null), every shopper degrades to a
      # local-only basket, and the checkout funnel is dead. MUST match the API's values.
      - CART_CREDENTIAL_SECRET=${CART_CREDENTIAL_SECRET}
      - CHECKOUT_INTENT_SECRET=${CHECKOUT_INTENT_SECRET}
      - NODE_OPTIONS=--max-old-space-size=400
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4321').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 15s
        max_failure_ratio: 0.1
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M


  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ops/caddy-fallback:/srv/caddy-fallback:ro
      - caddy_data:/data
      - caddy_config:/config

  pghero:
    image: ankane/pghero
    restart: always
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PGHERO_USERNAME=${PGHERO_USERNAME}
      - PGHERO_PASSWORD=${PGHERO_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    restart: always
    ports:
      - "127.0.0.1:9100:9100"

  sgtm-production:
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:stable
    restart: always
    environment:
      - CONTAINER_CONFIG=${GTM_CONTAINER_CONFIG}
      - RUN_AS_PREVIEW_SERVER=false
      - PREVIEW_SERVER_URL=https://metrics.shopgoldplus.com
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m

  sgtm-preview:
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:stable
    restart: always
    environment:
      - CONTAINER_CONFIG=${GTM_CONTAINER_CONFIG}
      - RUN_AS_PREVIEW_SERVER=true
    ports:
      - "127.0.0.1:8081:8080"
    mem_limit: 512m

volumes:
  pg_prod_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  redis_data:
