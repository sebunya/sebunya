# Goldie (site chat + WhatsApp) alerting rules. The api also pages the team itself through the Care Desk
# (urgent task -> SMS/email/push) for the same conditions, so these are for Prometheus/Grafana visibility.
# Two api replicas are scraped as separate targets: counters are summed across them, gauges read with max()
# (both replicas report the same Care Desk numbers from the database).
groups:
  - name: goldie
    rules:
      - alert: GoldieWhatsAppRepliesFailing
        expr: sum(increase(goldie_whatsapp_messages_total{outcome="failed"}[15m])) >= 3
        labels: { severity: page }
        annotations:
          summary: "Goldie could not answer {{ $value }} WhatsApp messages in 15 minutes"
          runbook: "docs/assistant/RUNBOOK.md#whatsapp-replies-failing"
      - alert: GoldieSocialRepliesFailing
        expr: sum(increase(goldie_social_messages_total{outcome="failed"}[15m])) >= 3
        labels: { severity: page }
        annotations:
          summary: "Goldie could not answer {{ $value }} Messenger/Instagram messages in 15 minutes"
          runbook: "docs/assistant/RUNBOOK.md#whatsapp-replies-failing"
      - alert: GoldieUrgentCustomerWaiting
        # The oldest urgent task nobody has taken (not the oldest task of any kind: callbacks wait for hours by design).
        expr: max(goldie_care_oldest_urgent_minutes) > 30
        labels: { severity: page }
        annotations:
          summary: "An urgent customer has waited {{ $value }} minutes on the Care Desk with nobody on it"
          runbook: "docs/assistant/RUNBOOK.md#urgent-customer-waiting"
      - alert: GoldieSpendNearCap
        expr: max(goldie_model_spend_ratio) >= 0.9
        labels: { severity: warn }
        annotations:
          summary: "Goldie's model spend is {{ $value | humanizePercentage }} of this month's cap"
          runbook: "docs/assistant/RUNBOOK.md#spend-near-the-cap"
      - alert: GoldieEscalationsFiring
        expr: sum(increase(goldie_care_escalations_total[1h])) >= 3
        labels: { severity: warn }
        annotations:
          summary: "Urgent tasks are being re-paged: nobody is taking them"
          runbook: "docs/assistant/RUNBOOK.md#nobody-taking-urgent-tasks"
