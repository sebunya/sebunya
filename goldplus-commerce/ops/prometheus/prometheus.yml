global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/goldie.rules.yml

scrape_configs:
  # One target per api replica (Docker DNS returns every replica's address for "api"). A single static "api:3000"
  # target would reach a random replica on each scrape, and its counters would look like resets.
  - job_name: goldplus-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: [api]
        type: A
        port: 3000
        refresh_interval: 30s

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
