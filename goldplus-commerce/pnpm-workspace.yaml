packages:
  - "apps/*"
  - "packages/*"

# Supply-chain guards (pnpm >= 10.16 enforces them; older pnpm ignores them).
# A version must be a week old before it is installed (hijacked releases are
# almost always caught and pulled well within that); a package whose publishing trust gets
# weaker is refused; sub-dependencies may not come from git or arbitrary URLs.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
